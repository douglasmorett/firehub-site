<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FireAccess</title>
<style>
  :root { --fundo:#111; --texto:#eee; --cinza:#888; --vermelho:#e5372b; --verde:#3fb950; --borda:#333; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--fundo); color:var(--texto); font:14px system-ui, sans-serif; }
  header { display:flex; gap:12px; align-items:center; padding:10px 16px; border-bottom:1px solid var(--borda); flex-wrap:wrap; }
  header b { color:var(--vermelho); }
  select, input, button { font:inherit; background:#222; color:var(--texto); border:1px solid var(--borda); border-radius:6px; padding:6px 10px; }
  button { cursor:pointer; }
  button.perigo { border-color:var(--vermelho); color:var(--vermelho); }
  #tela { display:block; max-width:100%; height:auto; margin:0 auto; user-select:none; -webkit-user-drag:none; }
  body.assumindo #tela { cursor:crosshair; outline:2px solid var(--vermelho); }
  #vazio { color:var(--cinza); text-align:center; padding:60px 16px; }
  #barra { display:flex; gap:8px; padding:8px 16px; flex-wrap:wrap; align-items:center; }
  #barra input { flex:1; min-width:200px; }
  label { color:var(--cinza); display:flex; gap:6px; align-items:center; }
  .selo { font-size:12px; padding:2px 8px; border-radius:99px; border:1px solid var(--borda); color:var(--cinza); }
  .selo.ok { color:var(--verde); border-color:var(--verde); }
  .selo.ruim { color:var(--vermelho); border-color:var(--vermelho); }
</style>
</head>
<body>
<header>
  <b>FireAccess</b>
  <select id="sessoes"><option value="">— nenhuma sessão —</option></select>
  <span id="admin" class="selo" hidden></span>
  <label><input type="checkbox" id="assumir"> assumir (meus cliques vão para o PC do cliente)</label>
  <span id="estado" style="color:var(--cinza)"></span>
</header>
<div id="barra" hidden>
  <input id="texto" placeholder="Digitar no PC do cliente (Enter envia)">
  <button data-tecla="enter">Enter</button>
  <button data-tecla="tab">Tab</button>
  <button data-tecla="backspace">⌫</button>
  <button data-tecla="esc">Esc</button>
  <button data-tecla="ctrl+v">Ctrl+V</button>
  <button data-tecla="alt+tab">Alt+Tab</button>
  <button data-tecla="win">Iniciar</button>
  <button class="perigo" id="encerrar">Encerrar sessão</button>
</div>
<img id="tela" alt="" hidden draggable="false">
<div id="vazio">Quando o cliente abrir o FireAccess e clicar em Permitir, a sessão aparece aqui.</div>
<script>
const $ = (id) => document.getElementById(id);
let token = sessionStorage.getItem("fa-token") || "";
if (!token) { token = prompt("Token do FireAccess") || ""; sessionStorage.setItem("fa-token", token); }
// No ar o relay fica em firehubfood.com.br/fireaccess-relay (o proxy tira o prefixo); local, na raiz.
const BASE = location.pathname.replace(/\/+$/, "").replace(/\/fireaccess$/, "");
const api = (p, corpo) => fetch(BASE + p, {
  method: corpo ? "POST" : "GET",
  headers: { authorization: "Bearer " + token, "content-type": "application/json" },
  body: corpo ? JSON.stringify(corpo) : undefined,
}).then(async (r) => {
  if (r.status === 204) return null;
  const j = await r.json();
  if (r.status === 401) { sessionStorage.removeItem("fa-token"); }
  if (!r.ok) throw new Error(j.erro || r.status);
  return j;
});

let atual = "";
let lista = [];
async function listar() {
  try {
    lista = await api("/sessoes");
    const sel = $("sessoes"), antes = sel.value;
    sel.innerHTML = '<option value="">— escolher sessão —</option>' + lista.map((s) =>
      `<option value="${s.codigo}" ${s.permitido ? "" : "disabled"}>${s.codigo} · ${s.maquina?.nome || "?"} ${s.permitido ? (s.caiu ? "(reconectando)" : "") : "(esperando Permitir)"}</option>`).join("");
    // Uma sessão só: já abre nela.
    const permitidas = lista.filter((s) => s.permitido);
    sel.value = permitidas.some((s) => s.codigo === antes) ? antes : (permitidas.length === 1 && !antes ? permitidas[0].codigo : "");
    if (sel.value !== atual) trocar(sel.value);
    const s = lista.find((x) => x.codigo === atual);
    $("admin").hidden = !s;
    if (s) {
      $("admin").textContent = s.maquina?.admin ? "administrador" : "sem administrador";
      $("admin").className = "selo " + (s.maquina?.admin ? "ok" : "ruim");
    }
  } catch (e) { $("estado").textContent = "erro: " + e.message; }
}
function trocar(c) {
  atual = c; seq = 0;
  $("tela").hidden = !c; $("barra").hidden = !c; $("vazio").hidden = !!c;
}
$("sessoes").onchange = (e) => trocar(e.target.value);
$("assumir").onchange = (e) => document.body.classList.toggle("assumindo", e.target.checked);

// Tela ao vivo: pede o quadro mais novo que o último visto (o relay segura até chegar um).
let tamanho = { baseLargura: 1, baseAltura: 1 };
let seq = 0, quadros = 0, desde = Date.now();
async function aoVivo() {
  for (;;) {
    if (!atual) { await new Promise((r) => setTimeout(r, 500)); continue; }
    const pedido = atual;
    try {
      const q = await api(`/sessoes/${pedido}/quadro?depois=${seq}`);
      if (q && pedido === atual) {
        seq = q.seq; tamanho = q; quadros++;
        // Ocupa a janela inteira sem deformar (a barra de cima fica visível).
        $("tela").style.width = `min(100%, calc((100vh - ${$("tela").offsetTop + 8}px) * ${q.largura / q.altura}))`;
        $("tela").src = "data:image/jpeg;base64," + q.jpeg;
        const s = (Date.now() - desde) / 1000;
        if (s >= 2) { $("estado").textContent = `ao vivo · ${(quadros / s).toFixed(1)} quadros/s`; quadros = 0; desde = Date.now(); }
      }
    } catch (e) {
      $("estado").textContent = "erro: " + e.message;
      await new Promise((r) => setTimeout(r, 1500));
    }
  }
}

const acao = (c) => atual && api(`/sessoes/${atual}/comando?quem=douglas`, { ...c, esperar: 0 }).catch((e) => $("estado").textContent = "erro: " + e.message);
const ponto = (e) => {
  const r = $("tela").getBoundingClientRect();
  return { x: Math.round((e.clientX - r.left) * tamanho.baseLargura / r.width), y: Math.round((e.clientY - r.top) * tamanho.baseAltura / r.height) };
};
const assumindo = () => $("assumir").checked;

// Clique simples espera um pouco para ver se vira duplo.
let cliqueAdiado = null;
$("tela").onclick = (e) => {
  if (!assumindo()) return;
  const p = ponto(e);
  clearTimeout(cliqueAdiado);
  if (e.detail >= 2) return acao({ tipo: "clicar", ...p, duplo: true });
  cliqueAdiado = setTimeout(() => acao({ tipo: "clicar", ...p }), 250);
};
$("tela").oncontextmenu = (e) => { if (!assumindo()) return; e.preventDefault(); acao({ tipo: "clicar", ...ponto(e), botao: "direito" }); };
let rolando = 0;
$("tela").addEventListener("wheel", (e) => {
  if (!assumindo()) return;
  e.preventDefault();
  if (Date.now() - rolando < 150) return;
  rolando = Date.now();
  acao({ tipo: "rolar", quanto: e.deltaY > 0 ? -3 : 3, ...ponto(e) });
}, { passive: false });
$("texto").onkeydown = (e) => {
  if (e.key !== "Enter" || !assumindo()) return;
  acao({ tipo: "digitar", texto: e.target.value }); e.target.value = "";
};
document.querySelectorAll("[data-tecla]").forEach((b) => b.onclick = () => assumindo() && acao({ tipo: "tecla", combo: b.dataset.tecla }));
$("encerrar").onclick = () => atual && confirm("Encerrar a sessão do cliente?") && api(`/sessoes/${atual}/encerrar`, {}).then(listar);

listar(); setInterval(listar, 3000); aoVivo();
</script>
</body>
</html>
