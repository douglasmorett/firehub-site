# AndroidX e obrigatorio: a androidx.security (EncryptedSharedPreferences, onde o
# token da maquininha fica guardado) so existe em AndroidX.
android.useAndroidX=true

# O AAR do WrapperPPS 1.35.0 e distribuido ja compilado contra AndroidX, entao
# nao ha nada de support library para converter. Jetifier ligado so faria o build
# reescrever bytecode a toa.
android.enableJetifier=false

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

kotlin.code.style=official

# R classes nao-transitivas: cada modulo enxerga so os proprios recursos. Como o
# app tem um modulo so, o ganho e de tempo de build, nao de arquitetura.
android.nonTransitiveRClass=true
